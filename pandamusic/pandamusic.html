<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SbatuffoBlog - PandaMusic</title>

<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://open.spotify.com/embed-podcast/iframe-api/v1" async></script>

<style>
:root {
    --primary: #ffcbfe; 
    --sbatuffo-blue: #0000ff; 
    --accent: #ff4757;
    --bg-soft: #fdfdfd;
    --text: #1a1a1a;
    --stroke: #1a1a1a;
    --heart-red: #ff4d4d;
}

body { 
    font-family: 'Fredoka', sans-serif; 
    margin: 0; 
    background: var(--bg-soft); 
    color: var(--text); 
    overflow-x: hidden; 
}

/* --- HEADER --- */
header { 
    background: #fff; 
    padding: 25px 15px 15px; 
    text-align: center; 
}

.header-container { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    position: relative;
    max-width: 900px;
    margin: 0 auto;
}

.brand-wrapper {
    text-align: center;
}

.brand-title { 
    font-family: 'Grandstander', cursive; 
    font-weight: 900; 
    font-size: clamp(2rem, 6vw, 4.2rem); 
    color: var(--sbatuffo-blue); 
    text-decoration: none; 
    line-height: 1; 
}

.brand-subtitle { 
    font-size: clamp(0.9rem, 3vw, 1.2rem); 
    color: var(--primary); 
    font-weight: 700; 
    margin-top: 5px; 
    text-transform: lowercase; 
}

/* --- DIVISORE --- */
.section-divider { 
    max-width: 200px; 
    height: 3px; 
    background: linear-gradient(to right, var(--primary) 0 calc(50% - 30px), transparent calc(50% - 30px) calc(50% + 30px), var(--primary) calc(50% + 30px) 100%); 
    margin: 30px auto; 
    border-radius: 50px; 
    position: relative; 
}

.section-divider::after { 
    content: "♥"; 
    position: absolute; 
    top: -14px; 
    left: 50%; 
    transform: translateX(-50%); 
    background: transparent; 
    padding: 0 15px; 
    color: var(--heart-red); 
    font-size: 1.5rem; 
}

.divider-concerti { 
    margin-top: 80px; 
    margin-bottom: 50px; 
}

.container { 
    width: 100%; 
    max-width: 900px; 
    margin: 0 auto; 
    padding: 15px; 
    box-sizing: border-box; 
    min-height: 50vh; 
}

.section-title { 
    font-family: 'Grandstander', cursive; 
    font-size: 1.9rem; 
    font-weight: 900; 
    margin: 20px 0 30px 0; 
    border-left: 6px solid var(--primary); 
    padding-left: 12px; 
}

/* --- GRIGLIA PLAYLIST --- */
.playlist-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

/* --- PLAYLIST CARD --- */
.playlist-card {
    background: #fff;
    border: 3.5px solid var(--stroke);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 8px 8px 0 var(--primary);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* Tasti Modifica Generici */
.btn-edit, .btn-edit-concert {
    position: absolute;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    z-index: 20;
    padding: 0;
}

.btn-edit {
    top: 15px;
    right: 15px;
    background: #fff;
    border: 2.5px solid var(--stroke);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 1rem;
    box-shadow: 3px 3px 0 var(--stroke);
}

.btn-edit:active, .btn-edit-concert:active { 
    transform: translate(3px, 3px); 
    box-shadow: 0px 0px 0 transparent !important; 
}

.card-content { 
    display: flex; 
    gap: 20px; 
    align-items: center; 
}

.cover-art {
    width: 110px; 
    height: 110px;
    border: 3px solid var(--stroke);
    border-radius: 18px;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    flex-shrink: 0;
    position: relative;
    box-sizing: border-box;
    padding: 10px;
    background-color: var(--cover-base, transparent);
    container-type: inline-size;
}

.cover-883 { background: linear-gradient(135deg, var(--cover-base, var(--sbatuffo-blue)), var(--primary)); }
.cover-cartoni { background: linear-gradient(135deg, var(--cover-base, var(--accent)), #ffb8b8); }
.cover-gemboy { background: linear-gradient(135deg, var(--cover-base, #636c00), #d0ff01); }
.cover-vasco { background: linear-gradient(135deg, var(--cover-base, #004f2a), #01f9a6); }
.cover-random1 { background: linear-gradient(135deg, var(--cover-base, #833ab4), #fd1d1d); }
.cover-random2 { background: linear-gradient(135deg, var(--cover-base, #00C9FF), #92FE9D); }
.cover-random3 { background: linear-gradient(135deg, var(--cover-base, #f12711), #f5af19); }

.cover-text { 
    font-family: 'Grandstander', cursive; 
    font-weight: 900;
    line-height: 1.1; 
    color: #fff; 
    text-shadow: 2px 2px 0 var(--stroke); 
    text-align: center;
    word-break: break-word;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    width: 100%;
    font-size: clamp(0.6rem, calc(150cqw / (var(--char-count, 8) + 3)), 1.35rem);
}

.cassette-mechanism {
    background: #e0e0e0; 
    border: 3px solid var(--stroke); 
    border-radius: 15px;
    margin-top: 15px; 
    padding: 12px; 
    display: flex; 
    justify-content: center; 
    gap: 60px;
    box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
}

.reel { 
    width: 45px; 
    height: 45px; 
    background: #222; 
    border-radius: 50%; 
    border: 4px solid #555; 
    position: relative; 
}

.reel::after {
    content: ''; 
    position: absolute; 
    width: 100%; 
    height: 100%;
    background: repeating-conic-gradient(from 0deg, transparent 0deg 30deg, #444 31deg 60deg);
    border-radius: 50%;
}

.spinning { 
    animation: spinReel 2.5s linear infinite; 
}

@keyframes spinReel { 
    100% { transform: rotate(360deg); } 
}

.playlist-info { 
    flex: 1; 
    padding-right: 25px; 
}

.btn-group { 
    display: flex; 
    gap: 10px; 
    flex-wrap: wrap; 
    margin-top: 15px; 
}

.btn {
    font-family: 'Fredoka', sans-serif; 
    font-weight: 700; 
    font-size: 0.85rem; 
    padding: 10px 15px;
    border: 2.5px solid var(--stroke); 
    border-radius: 12px;
    cursor: pointer; 
    text-decoration: none; 
    transition: 0.15s;
    box-shadow: 3px 3px 0 var(--stroke);
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    gap: 6px;
    text-align: center;
}

.btn-link { 
    background: #fff; 
    color: var(--text); 
}

.btn-play { 
    background: var(--primary); 
    color: var(--stroke); 
}

.player-container {
    margin-top: 20px;
    display: none;
    animation: slideDown 0.4s ease-out forwards;
}

.youtube-embed iframe, .amazon-embed iframe {
    width: 100%;
    border: 0;
    border-radius: 16px;
}

.youtube-embed iframe {
    aspect-ratio: 16 / 9;
}

.amazon-embed iframe {
    height: 350px;
}

@keyframes slideDown { 
    from { opacity: 0; transform: translateY(-10px); } 
    to { opacity: 1; transform: translateY(0); } 
}

/* --- SEZIONE AGGIUNGI & MODALI --- */
.btn-add-container { 
    text-align: center; 
    margin: 40px 0; 
}

.overlay { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(0,0,0,0.7); 
    display: none; 
    align-items: center; 
    justify-content: center; 
    z-index: 1000; 
    backdrop-filter: blur(3px); 
}

.cd-shape { 
    background: #e0e0e0; 
    border-radius: 50%; 
    width: 95vw; 
    max-width: 550px;
    aspect-ratio: 1; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    border: 15px solid #555; 
    position: relative; 
    box-shadow: 0 0 0 4px var(--primary), 0 10px 30px rgba(0,0,0,0.5); 
    box-sizing: border-box; 
    max-height: 95vh;
}

.cd-hole { 
    position: absolute; 
    width: 15%; 
    aspect-ratio: 1; 
    background: rgba(0,0,0,0.6); 
    border-radius: 50%; 
    border: 5px solid #999; 
    z-index: 0; 
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8); 
}

.modal-rect {
    background: #fdfdfd; 
    width: 95vw; 
    max-width: 550px; 
    max-height: 90vh;
    border-radius: 20px; 
    border: 4px solid var(--stroke); 
    box-shadow: 8px 8px 0 var(--primary);
    display: flex; 
    flex-direction: column; 
    position: relative; 
    overflow: hidden;
}

.modal-content { 
    z-index: 1; 
    text-align: center; 
    width: 85%; 
    background: rgba(255,255,255,0.95); 
    padding: 20px 20px; 
    border-radius: 15px; 
    border: 2px dashed #999; 
    box-sizing: border-box;
    max-height: 75vh; 
    overflow-y: auto; 
}

.modal-rect .modal-content {
    width: 100%; 
    border: none; 
    background: transparent; 
    padding: 25px;
    max-height: calc(90vh - 50px);
}

.cd-shape .modal-content {
    background: transparent;
    border-color: transparent;
}

.modal-content::-webkit-scrollbar { width: 6px; }
.modal-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

.form-group { margin-bottom: 12px; }
.form-group input { 
    width: 100%; 
    padding: 12px; 
    border: 2px solid var(--stroke); 
    border-radius: 8px; 
    font-family: 'Fredoka', sans-serif; 
    box-sizing: border-box; 
    font-size: 0.95rem; 
}

.modal-btns { 
    display: flex; 
    gap: 10px; 
    justify-content: center; 
    flex-wrap: wrap; 
    margin-top: 15px; 
}

/* Editor foto concerti */
.photo-editor-grid {
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 10px; 
    margin-top: 10px; 
    margin-bottom: 15px;
}

.photo-thumb-container {
    position: relative; 
    aspect-ratio: 1; 
    border-radius: 8px; 
    border: 2px solid var(--stroke);
    overflow: hidden; 
    background: #eee;
}

.photo-thumb-container img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
}

.btn-delete-photo {
    position: absolute; 
    top: 4px; 
    right: 4px; 
    background: var(--accent); 
    color: white;
    border: none; 
    border-radius: 50%; 
    width: 22px; 
    height: 22px; 
    font-size: 10px;
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
}

/* --- CONCERTI --- */
.concert-card {
    background: #111;
    border: 4px solid #222;
    border-radius: 20px;
    overflow: visible;
    margin-bottom: 50px;
    position: relative;
    box-shadow: 10px 10px 30px rgba(0,0,0,0.3);
}

.concert-card::before {
    content: ''; 
    position: absolute; 
    top: 15px; 
    left: 50%; 
    transform: translateX(-50%);
    width: 70px; 
    height: 16px; 
    background: var(--bg-soft); 
    border-radius: 20px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.8); 
    z-index: 5; 
    border: 2px solid #333;
}

.btn-edit-concert {
    top: 12px; 
    left: 15px; 
    background: #ffd700; 
    color: #000; 
    border: 3px solid #000;
    border-radius: 50%; 
    width: 38px; 
    height: 38px; 
    font-size: 1.8rem; 
    font-weight: 900;
    line-height: 1;
    padding: 0;
    display: grid;
    place-items: center;
    font-family: 'Arial Black', Arial, sans-serif;
    box-shadow: 2px 2px 0 #000;
}

.concert-header {
    position: relative;
    overflow: hidden; 
    padding: 42px 20px 12px; 
    text-align: center;
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    background: repeating-linear-gradient(45deg, #181818, #181818 10px, #111 10px, #111 20px);
    border-bottom: 2px dashed #444;
    border-bottom-color: inherit;
}

.pass-badge {
    position: absolute;
    top: 30px;
    right: -65px;
    width: 180px;
    transform: rotate(45deg);
    background: #ffd700; 
    color: #000;
    font-family: 'Fredoka', sans-serif; 
    font-weight: 700; 
    font-size: 0.75rem;
    padding: 6px 0;
    letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    z-index: 10;
    text-align: center;
}

.pass-details {
    color: #ccc;
    font-family: 'Fredoka', sans-serif; 
    font-weight: 700; 
    font-size: 1rem;
    margin-top: 4px; 
    text-transform: uppercase; 
    letter-spacing: 1px;
}

.pass-details span { 
    margin: 0 8px; 
}

.concert-card .concert-header h2 {
    color: #fff; 
    font-family: 'Grandstander', cursive; 
    font-size: 2.2rem; 
    margin: 0; 
    text-transform: uppercase; 
    letter-spacing: 2px;
}

.slideshow-container {
    padding: 15px 15px 5px 15px; 
    background: #1e1e1e;
    border-bottom-left-radius: 16px; 
    border-bottom-right-radius: 16px;
}

.slideshow {
    display: flex; 
    gap: 20px; 
    overflow-x: auto;
    scroll-snap-type: x mandatory; 
    padding: 10px 5px 10px 5px; 
}

.slideshow::-webkit-scrollbar { height: 10px; }
.slideshow::-webkit-scrollbar-thumb { 
    background: #555; 
    border-radius: 10px; 
    border: 2px solid #1e1e1e; 
}

.slideshow img {
    height: 220px; 
    width: auto; 
    max-width: 80vw; 
    object-fit: cover;
    background: #fdfdfd; 
    padding: 10px 10px 15px 10px; 
    border-radius: 3px;
    scroll-snap-align: center; 
    flex-shrink: 0;
    box-shadow: 4px 6px 15px rgba(0,0,0,0.6);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.slideshow img:hover { 
    transform: scale(1.05) rotate(0deg) !important; 
    z-index: 10; 
    position: relative; 
}

.slideshow img:nth-child(odd) { transform: rotate(-3deg); }
.slideshow img:nth-child(even) { transform: rotate(3deg); }

/* --- FOOTER --- */
footer { 
    padding: 40px 10px; 
    text-align: center; 
    font-family: 'Grandstander', cursive; 
    font-weight: 600; 
    color: #666; 
    font-size: 1.1rem; 
    border-top: 2px solid #eee; 
}

.footer-home-link { 
    text-decoration: none; 
    color: inherit; 
    display: inline-flex; 
    align-items: center; 
    gap: 8px; 
    vertical-align: middle;
    transition: transform 0.2s ease;
}

.footer-home-link:hover { transform: scale(1.05); }

.footer-home-link img { width: 60px; height: auto; }

@media (max-width: 700px) { 
    .playlist-grid { grid-template-columns: 1fr; }
    .card-content { flex-direction: row; align-items: center; gap: 12px; }
    .cover-art { width: 85px; height: 85px; padding: 5px; border-radius: 12px; }
    .playlist-info { padding-right: 0; }
    .playlist-info h3 { font-size: 1.4rem !important; }
    .playlist-info p { font-size: 0.85rem; margin: 6px 0; }
    .btn-group { display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: space-between; gap: 8px; }
    .btn { flex: 1; font-size: 0.70rem; padding: 10px 5px; box-shadow: 2px 2px 0 var(--stroke); white-space: nowrap; }
    .cassette-mechanism { gap: 25px; padding: 10px; margin-top: 10px; }
    .reel { width: 35px; height: 35px; }
    .playlist-card { padding: 15px; }
    .btn-edit { width: 32px; height: 32px; font-size: 0.85rem; top: 12px; right: 12px; }
    .btn-edit-concert { width: 32px; height: 32px; font-size: 1.2rem; top: 12px; left: 12px; }
    .concert-header { padding-top: 48px; } 
    .pass-badge { top: 25px; right: -60px; width: 190px; font-size: 0.65rem; }
    .concert-card .concert-header h2 { font-size: 1.6rem !important; }
    .pass-details { font-size: 0.85rem; }
    .slideshow img { height: 180px; }
}
</style>
</head>

<body>
<header>
  <div class="header-container">
    <div class="brand-wrapper">
      <a href="../index.html" class="brand-title">SbatuffoBlog</a>
      <div class="brand-subtitle">PandaMusic</div>
    </div>
  </div>
</header>

<div class="section-divider"></div>

<main class="container">
  <div class="section-title">Le nostre playlist 🎵</div>
  
  <div class="playlist-grid" id="playlist-container"></div> 
  
  <div class="btn-add-container">
      <button id="btn-add-playlist" class="btn btn-play" style="padding: 15px 30px; font-size: 1.1rem;">
          ➕ Aggiungi nuova Playlist
      </button>
  </div>

  <div class="section-divider divider-concerti"></div>

  <div class="section-title">I nostri concerti 🎸</div>
  
  <div id="concerts-container">
      </div>

  <div class="btn-add-container">
      <button id="btn-add-concert" class="btn btn-play" style="padding: 15px 30px; font-size: 1.1rem; background: #ffd700; color: #000;">
          ➕ Aggiungi Concerto
      </button>
  </div>

</main>

<div class="section-divider"></div>

<footer>
    @SbatuffoBlog 2026 - 
    <a href="../index.html" class="footer-home-link">
      Home <img src="img/home.png" alt="Home">
    </a>
</footer>

<div id="modal-cd-overlay" class="overlay">
    <div class="cd-shape">
        <div class="cd-hole"></div>
        <div class="modal-content">
            <h3 id="modal-title" style="font-family: 'Grandstander'; font-size: 1.6rem; margin-top: 0; margin-bottom: 15px; color: #000000;">Nuovo Disco</h3>
            <div class="form-group"><input id="new-nome" placeholder="Nome Playlist (es. Rock)" required></div>
            <div class="form-group"><input id="new-desc" placeholder="Breve descrizione..." required></div>
            <div class="form-group"><input id="new-link" placeholder="Link web (Spotify / YouTube / Amazon Music)" required></div>
            
            <!-- Modifica applicata qui per avere label e colore sulla stessa riga -->
            <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                <label for="new-color" style="margin-bottom:0; font-size:0.95rem; font-weight: 600;">Colore Playlist</label>
                <input id="new-color" type="color" value="#0000ff" style="flex: 0 0 50%; width: 50%; height: 40px; border: 2px solid var(--stroke); border-radius: 8px; padding: 0; cursor: pointer;" />
            </div>
            
            <div class="modal-btns">
                <button id="btn-cd-ok" class="btn btn-play" style="background: var(--primary); color: #000000;">Registra ⏺️</button>
                <button id="btn-cd-delete" class="btn btn-play" style="background:  #260506 ; color: white; display: none;">Elimina 🗑️</button>
                <button id="btn-cd-cancel" class="btn btn-link" style="background: var(--accent); color: white;">Annulla ✖</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-concert-overlay" class="overlay">
    <div class="modal-rect">
        <div class="modal-content">
            <h3 id="modal-concert-title" style="font-family: 'Grandstander'; font-size: 1.8rem; margin-top: 0; margin-bottom: 15px;">Nuovo Concerto</h3>
            
            <div class="form-group"><input id="concert-nome" placeholder="Artista / Titolo (es. Vasco)" required></div>
            <div class="form-group"><input id="concert-luogo" placeholder="Luogo (es. Trento)" required></div>
            <div class="form-group"><input id="concert-data" placeholder="Data (es. 20 maggio 2022)" required></div>
            <div class="form-group">
                <label for="concert-color" style="display:block; text-align:left; margin-bottom:6px; font-size:0.95rem; font-weight: bold;">Colore Tema (Striscia & Testo)</label>
                <input id="concert-color" type="color" value="#01f9a6" style="width:100%; height:44px; border: 2px solid var(--stroke); border-radius: 12px; padding: 0;" />
            </div>
            
            <div class="form-group" style="text-align: left; margin-top: 20px;">
                <label style="display:block; margin-bottom:6px; font-size:0.95rem; font-weight: bold;">Gestisci Foto</label>
                <div class="photo-editor-grid" id="photo-editor-grid">
                    </div>
                <input type="file" id="concert-photos-input" multiple accept="image/*" style="font-size: 0.85rem; padding: 8px;">
                <small style="display:block; color:#666; font-size:0.75rem; margin-top: 4px;">Le immagini verranno ridimensionate automaticamente per il web.</small>
            </div>
            
            <div class="modal-btns" style="margin-top: 25px;">
                <button id="btn-concert-ok" class="btn btn-play" style="background: #ffd700; color: #000; border-color: #000;">Salva Concerto 🎸</button>
                <button id="btn-concert-delete" class="btn btn-play" style="background: #260506 ; color: white; display: none;">Elimina Concerto 🗑️</button>
                <button id="btn-concert-cancel" class="btn btn-link" style="background: var(--accent); color: white;">Annulla ✖</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- DATI E STATI GLOBALI ---
let playlistsData = [];
let concertsData = [];
let isSpotifyApiReady = false;
let editingIndex = -1;
let editingConcertIndex = -1;
let tempConcertImages = [];

const apiMusicURL = "https://tisbatuffoblog.vercel.app/api/update_musicAPI";
const apiConcertURL = "https://tisbatuffoblog.vercel.app/api/update_concertAPI"; 

// --- UTILITIES FOTO CONCERTI ---
function loadLegacyConcertImages(concert, callback) {
    if (concert.images.length > 0 && concert.images.some(img => img.includes(concert.id))) {
        if (callback) callback();
        return;
    }
    let currentIndex = 1;
    function tryLoadNextImage() {
        const imagePath = `img/${concert.id}/${concert.id} (${currentIndex}).jpg`;
        const img = new Image();
        img.onload = function() {
            if (!concert.images.includes(imagePath)) { 
                concert.images.push(imagePath); 
            }
            currentIndex++;
            if (currentIndex <= 50) { 
                tryLoadNextImage(); 
            } else { 
                if(callback) callback(); 
            }
        };
        img.onerror = function() { 
            if(callback) callback(); 
        }
        img.src = imagePath;
    }
    tryLoadNextImage();
}

function resizeImage(file, maxWidth = 800) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                if (width > maxWidth) { 
                    height = Math.round((height * maxWidth) / width); 
                    width = maxWidth; 
                }
                
                canvas.width = width; 
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

function generateSpotifyUri(link) {
    if (link.startsWith('spotify:')) return link;
    try { 
        const url = new URL(link); 
        if (url.hostname.includes('spotify.com') || link.includes('spotify.com')) { 
            const pathParts = url.pathname.split('/').filter(p => p); 
            if (pathParts.length >= 2) return `spotify:${pathParts[0]}:${pathParts[1]}`; 
        } 
        return link;
    } catch(e) { 
        return link; 
    }
}

function getLinkType(link) {
    try { 
        if (link.startsWith('spotify:')) return 'spotify'; 
        const url = new URL(link); 
        if (url.hostname.includes('spotify.com') || link.includes('spotify.com')) return 'spotify'; 
        if (url.hostname.includes('youtube') || url.hostname.includes('youtu.be')) return 'youtube'; 
        if (url.hostname.includes('amazon') || url.hostname.includes('amzn')) return 'amazon'; 
        return 'web'; 
    } catch(e) { 
        return 'web'; 
    }
}

function getYoutubeEmbedUrl(link) {
    try { 
        let resUrl = link; 
        if (link.includes('<iframe') && link.includes('src="')) { 
            const match = link.match(/src="([^"]+)"/); 
            if (match) resUrl = match[1]; 
        } 
        if (!resUrl.startsWith('http://') && !resUrl.startsWith('https://')) { 
            if (resUrl.includes('youtube') || resUrl.includes('youtu.be')) resUrl = 'https://' + resUrl; 
            else return link; 
        } 
        
        const url = new URL(resUrl); 
        const host = url.hostname.toLowerCase(); 
        let videoId = ""; 
        let listId = url.searchParams.get('list'); 
        
        if (host.includes('youtu.be')) { 
            videoId = url.pathname.split('/').filter(p => p)[0]; 
        } else if (host.includes('youtube.com')) { 
            if (url.pathname.includes('/shorts/')) videoId = url.pathname.split('/shorts/')[1].split('/')[0]; 
            else if (url.pathname.includes('/embed/')) videoId = url.pathname.split('/embed/')[1].split('?')[0]; 
            else videoId = url.searchParams.get('v'); 
        } 
        
        let embedBase = ""; 
        if (listId && videoId) embedBase = `https://www.youtube-nocookie.com/embed/${videoId}?list=${listId}`; 
        else if (listId) embedBase = `https://www.youtube-nocookie.com/embed/videoseries?list=${listId}`; 
        else if (videoId) embedBase = `https://www.youtube-nocookie.com/embed/${videoId}`; 
        else embedBase = resUrl.replace('youtube.com', 'youtube-nocookie.com'); 
        
        const finalUrl = new URL(embedBase); 
        finalUrl.searchParams.set('enablejsapi', '1'); 
        return finalUrl.toString(); 
    } catch(e) { 
        return link; 
    }
}

function getAmazonEmbedUrl(link) {
    try { 
        if (link.includes('<iframe') && link.includes('src="')) { 
            const match = link.match(/src="([^"]+)"/); 
            if (match) return match[1]; 
        } 
        const url = new URL(link); 
        if (url.pathname.includes('/embed/')) return link; 
        if (url.hostname.includes('amazon.')) { 
            let path = url.pathname; 
            if (path.includes('/music/player')) path = path.replace('/music/player', ''); 
            if (path.includes('/user-playlists/')) path = path.replace('/user-playlists/', '/playlists/'); 
            let hostname = url.hostname; 
            if (!hostname.startsWith('music.')) hostname = 'music.' + hostname; 
            return `https://${hostname}/embed${path}${url.search}`; 
        } 
        return link; 
    } catch(e) { 
        return link; 
    }
}

                    ? `<div class="amazon-embed"><iframe src="${getAmazonEmbedUrl(p.linkSpotify)}" title="Amazon Music player" frameborder="0" allow="autoplay" loading="lazy"></iframe></div>`

function initSpotifyPlayers(IFrameAPI) {
    const cards = document.querySelectorAll('.playlist-card');
    cards.forEach(card => {
        const embedElement = card.querySelector('.spotify-embed'); 
        if (!embedElement || embedElement.hasAttribute('data-initialized')) return; 
        
        const uri = embedElement.getAttribute('data-spotify-uri'); 
        const reels = card.querySelectorAll('.reel');
        const options = { width: '100%', height: '80', uri: uri };
        
        IFrameAPI.createController(embedElement, options, (EmbedController) => {
            EmbedController.addListener('playback_update', e => {
                if (e.data.isPaused || e.data.isBuffering) { 
                    reels.forEach(r => r.classList.remove("spinning")); 
                } else { 
                    reels.forEach(r => r.classList.add("spinning")); 
                }
            });
        });
        embedElement.setAttribute('data-initialized', 'true');
    });
}

window.addEventListener('message', (event) => {
    const origin = event.origin || '';
    if (!origin.includes('youtube') && !origin.includes('youtu.be')) return;
    try {
        let data = event.data;
        if (typeof data === 'string') {
            try {
                data = JSON.parse(data);
            } catch (e) {
                return;
            }
        }

        const playerState = data?.info?.playerState ?? data?.playerState ?? data?.data;
        if (playerState === undefined) return;

        document.querySelectorAll('.youtube-embed iframe').forEach(iframe => {
            if (iframe.contentWindow === event.source) {
                const card = iframe.closest('.playlist-card');
                if (card) {
                    setReelsState(card, playerState === 1);
                }
            }
        });
    } catch (e) {}
});

        arrayAggiornato[editingIndex].nome = nome; 
        arrayAggiornato[editingIndex].descrizione = desc; 
        arrayAggiornato[editingIndex].linkSpotify = link; 
        arrayAggiornato[editingIndex].uriSpotify = generateSpotifyUri(link); 
        arrayAggiornato[editingIndex].stile = { ...arrayAggiornato[editingIndex].stile, color: color };
    }
    
    try {
        const res = await fetch(apiMusicURL, { 
            method: "POST", 
            headers: { "Content-Type": "application/json" }, 
            body: JSON.stringify(arrayAggiornato) 
        });
        
        if (res.ok) { 
            playlistsData = arrayAggiornato; 
            renderPlaylists(); 
            modalCdOverlay.style.display = "none"; 
        }
    } catch(err) { 
        alert("Errore di connessione."); 
    } finally { 
        btnOk.innerText = editingIndex === -1 ? "Registra ⏺️" : "Aggiorna 🔄"; 
        btnOk.disabled = false; 
    }
};

document.getElementById("btn-cd-delete").onclick = async () => {
    if (confirm("Sei sicuro di voler eliminare questa cassetta?")) {
        const btnDelete = document.getElementById("btn-cd-delete"); 
        btnDelete.innerText = "Eliminazione..."; 
        btnDelete.disabled = true;
        
        let arrayAggiornato = [...playlistsData]; 
        arrayAggiornato.splice(editingIndex, 1);
        
        try {
            const res = await fetch(apiMusicURL, { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify(arrayAggiornato) 
            });
            
            if (res.ok) { 
                playlistsData = arrayAggiornato; 
                renderPlaylists(); 
                modalCdOverlay.style.display = "none"; 
            }
        } catch(err) { 
            alert("Errore."); 
        } finally { 
            btnDelete.innerText = "Elimina 🗑️"; 
            btnDelete.disabled = false; 
        }
    }
};

// --- INIT ---
document.addEventListener("DOMContentLoaded", () => {
    fetchPlaylists(); 
    fetchConcerts();
});
</script>
