<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SbatuffoBlog - PandaMusic</title>

<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://open.spotify.com/embed-podcast/iframe-api/v1" async></script>

<style>
:root {
  --primary: #ffcbfe; 
  --sbatuffo-blue: #0000ff; 
  --accent: #ff4757;
  --bg-soft: #fdfdfd;
  --text: #1a1a1a;
  --stroke: #1a1a1a;
  --heart-red: #ff4d4d;
}

body { 
    font-family: 'Fredoka', sans-serif; 
    margin: 0; 
    background: var(--bg-soft); 
    color: var(--text); 
    overflow-x: hidden; 
}

/* --- HEADER --- */
header { 
    background: #fff; 
    padding: 25px 15px 15px; 
    text-align: center; 
}
.header-container { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    position: relative;
    max-width: 900px;
    margin: 0 auto;
}
.brand-wrapper {
    text-align: center;
}
.brand-title { font-family: 'Grandstander', cursive; font-weight: 900; font-size: clamp(2rem, 6vw, 4.2rem); color: var(--sbatuffo-blue); text-decoration: none; line-height: 1; }
.brand-subtitle { font-size: clamp(0.9rem, 3vw, 1.2rem); color: var(--primary); font-weight: 700; margin-top: 5px; text-transform: lowercase; }

/* --- DIVISORE --- */
.section-divider { max-width: 200px; height: 3px; background: linear-gradient(to right, var(--primary) 0 calc(50% - 30px), transparent calc(50% - 30px) calc(50% + 30px), var(--primary) calc(50% + 30px) 100%); margin: 30px auto; border-radius: 50px; position: relative; }
.section-divider::after { content: "♥"; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: transparent; padding: 0 15px; color: var(--heart-red); font-size: 1.5rem; }

.divider-concerti { margin-top: 80px; margin-bottom: 50px; }

.container { width: 100%; max-width: 900px; margin: 0 auto; padding: 15px; box-sizing: border-box; min-height: 50vh; }
.section-title { font-family: 'Grandstander', cursive; font-size: 1.9rem; font-weight: 900; margin: 20px 0 30px 0; border-left: 6px solid var(--primary); padding-left: 12px; }

/* --- GRIGLIA PLAYLIST --- */
.playlist-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

/* --- PLAYLIST CARD --- */
.playlist-card {
    background: #fff;
    border: 3.5px solid var(--stroke);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 8px 8px 0 var(--primary);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* Tasto Modifica (Matita) */
.btn-edit {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #fff;
    border: 2.5px solid var(--stroke);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 3px 3px 0 var(--stroke);
    transition: 0.15s;
    z-index: 10;
    padding: 0;
}
.btn-edit:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0 var(--stroke); }

.card-content { display: flex; gap: 20px; align-items: center; }

.cover-art {
    width: 110px; height: 110px;
    border: 3px solid var(--stroke);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    position: relative;
    box-sizing: border-box;
    padding: 10px;
    background-color: var(--cover-base, transparent);
    container-type: inline-size;
}
.cover-883 { background: linear-gradient(135deg, var(--cover-base, var(--sbatuffo-blue)), var(--primary)); }
.cover-cartoni { background: linear-gradient(135deg, var(--cover-base, var(--accent)), #ffb8b8); }
.cover-gemboy { background: linear-gradient(135deg, var(--cover-base, #636c00), #d0ff01); }
.cover-vasco { background: linear-gradient(135deg, var(--cover-base, #004f2a), #01f9a6); }
.cover-random1 { background: linear-gradient(135deg, var(--cover-base, #833ab4), #fd1d1d); }
.cover-random2 { background: linear-gradient(135deg, var(--cover-base, #00C9FF), #92FE9D); }
.cover-random3 { background: linear-gradient(135deg, var(--cover-base, #f12711), #f5af19); }

.cover-text { 
    font-family: 'Grandstander', cursive; font-weight: 900;
    line-height: 1.1; color: #fff; text-shadow: 2px 2px 0 var(--stroke); text-align: center;
    word-break: break-word;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    width: 100%;
    font-size: clamp(0.6rem, calc(150cqw / (var(--char-count, 8) + 3)), 1.35rem);
}

.cassette-mechanism {
    background: #e0e0e0; border: 3px solid var(--stroke); border-radius: 15px;
    margin-top: 15px; padding: 12px; display: flex; justify-content: center; gap: 60px;
    box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
}
.reel { width: 45px; height: 45px; background: #222; border-radius: 50%; border: 4px solid #555; position: relative; }
.reel::after {
    content: ''; position: absolute; width: 100%; height: 100%;
    background: repeating-conic-gradient(from 0deg, transparent 0deg 30deg, #444 31deg 60deg);
    border-radius: 50%;
}
.spinning { animation: spinReel 2.5s linear infinite; }
@keyframes spinReel { 100% { transform: rotate(360deg); } }

.playlist-info { flex: 1; padding-right: 25px; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
.btn {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 0.85rem; padding: 10px 15px;
    border: 2.5px solid var(--stroke); border-radius: 12px;
    cursor: pointer; text-decoration: none; transition: 0.15s;
    box-shadow: 3px 3px 0 var(--stroke);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-align: center;
}
.btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0 var(--stroke); }
.btn-link { background: #fff; color: var(--text); }
.btn-play { background: var(--primary); color: var(--stroke); }

.player-container {
    margin-top: 20px;
    display: none;
    animation: slideDown 0.4s ease-out forwards;
}
.youtube-embed iframe, .amazon-embed iframe {
    width: 100%;
    border: 0;
    border-radius: 16px;
}
.youtube-embed iframe {
    aspect-ratio: 16 / 9;
}
.amazon-embed iframe {
    height: 350px;
}
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

/* --- SEZIONE AGGIUNGI PLAYLIST & MODAL CD --- */
.btn-add-container { text-align: center; margin: 40px 0; }

.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px); }
.cd-shape { 
    background: #e0e0e0; border-radius: 50%; 
    width: 95vw; max-width: 550px;
    aspect-ratio: 1; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    border: 15px solid #bbb; position: relative; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; 
    max-height: 95vh;
}
.cd-hole { position: absolute; width: 15%; aspect-ratio: 1; background: rgba(0,0,0,0.6); border-radius: 50%; border: 5px solid #999; z-index: 0; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
.modal-content { 
    z-index: 1; text-align: center; width: 85%; 
    background: rgba(255,255,255,0.95); padding: 20px 20px; 
    border-radius: 15px; border: 2px dashed #999; 
    box-sizing: border-box;
    max-height: 75vh; 
    overflow-y: auto; 
}
.modal-content::-webkit-scrollbar { width: 6px; }
.modal-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

.form-group { margin-bottom: 12px; }
.form-group input { width: 100%; padding: 12px; border: 2px solid var(--stroke); border-radius: 8px; font-family: 'Fredoka', sans-serif; box-sizing: border-box; font-size: 0.95rem; }
.modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }

/* --- CONCERTI --- */
.concert-card {
    background: #111;
    border: 4px solid #222;
    border-radius: 20px;
    overflow: visible;
    margin-bottom: 50px;
    position: relative;
    box-shadow: 10px 10px 30px rgba(0,0,0,0.3);
}

.concert-card::before {
    content: ''; position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    width: 70px; height: 16px; background: var(--bg-soft); border-radius: 20px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.8); z-index: 5; border: 2px solid #333;
}

.concert-header {
    position: relative;
    overflow: hidden; 
    padding: 42px 20px 12px; 
    text-align: center;
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    background: repeating-linear-gradient(45deg, #181818, #181818 10px, #111 10px, #111 20px);
    border-bottom: 2px dashed #444;
}

.pass-badge {
    position: absolute;
    top: 30px;
    right: -65px;
    width: 180px;
    transform: rotate(45deg);
    background: #ffd700; color: #000;
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 0.75rem;
    padding: 6px 0;
    letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    z-index: 10;
    text-align: center;
}

.pass-details {
    color: #ccc;
    font-family: 'Fredoka', sans-serif; 
    font-weight: 700; 
    font-size: 1rem;
    margin-top: 4px; 
    text-transform: uppercase; 
    letter-spacing: 1px;
}
.pass-details span { margin: 0 8px; }

.pass-vasco { border-color: #01f9a6; box-shadow: 0 0 20px rgba(1, 249, 166, 0.15), inset 0 0 15px rgba(1, 249, 166, 0.1); }
.pass-vasco .concert-header h2 {
    color: #fff; font-family: 'Grandstander', cursive; font-size: 2.2rem; margin: 0; text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 0 0 5px #fff, 0 0 15px #01f9a6, 0 0 30px #01f9a6;
}

.pass-cristina { border-color: #ff4757; box-shadow: 0 0 20px rgba(255, 71, 87, 0.15), inset 0 0 15px rgba(255, 71, 87, 0.1); }
.pass-cristina .concert-header h2 {
    color: #fff; font-family: 'Grandstander', cursive; font-size: 2.2rem; margin: 0; text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 0 0 5px #fff, 0 0 15px #ff4757, 0 0 30px #ff4757;
}

.pass-gemboy { border-color: #d0ff01; box-shadow: 0 0 20px rgba(208, 255, 1, 0.15), inset 0 0 15px rgba(208, 255, 1, 0.1); }
.pass-gemboy .concert-header h2 {
    color: #fff; font-family: 'Grandstander', cursive; font-size: 2.2rem; margin: 0; text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 0 0 5px #fff, 0 0 15px #d0ff01, 0 0 30px #d0ff01;
}

.slideshow-container {
    padding: 15px 15px 5px 15px; 
    background: #1e1e1e;
    border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
}

.slideshow {
    display: flex; gap: 20px; overflow-x: auto;
    scroll-snap-type: x mandatory; padding: 10px 5px 10px 5px; 
}
.slideshow::-webkit-scrollbar { height: 10px; }
.slideshow::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; border: 2px solid #1e1e1e; }

.slideshow img {
    height: 220px; width: auto; max-width: 80vw; object-fit: cover;
    background: #fdfdfd; padding: 10px 10px 15px 10px; 
    border-radius: 3px;
    scroll-snap-align: center; flex-shrink: 0;
    box-shadow: 4px 6px 15px rgba(0,0,0,0.6);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.slideshow img:hover { transform: scale(1.05) rotate(0deg) !important; z-index: 10; position: relative; }
.slideshow img:nth-child(odd) { transform: rotate(-3deg); }
.slideshow img:nth-child(even) { transform: rotate(3deg); }

/* --- FOOTER --- */
footer { 
  padding: 40px 10px; 
  text-align: center; 
  font-family: 'Grandstander', cursive; 
  font-weight: 600; 
  color: #666; 
  font-size: 1.1rem; 
  border-top: 2px solid #eee; 
}
.footer-home-link { 
  text-decoration: none; 
  color: inherit; 
  display: inline-flex; 
  align-items: center; 
  gap: 8px; 
  vertical-align: middle;
  transition: transform 0.2s ease;
}
.footer-home-link:hover { transform: scale(1.05); }
.footer-home-link img { 
  width: clamp(40px, 8vw, 60px); 
  height: auto; 
}

@media (max-width: 700px) { 
    .playlist-grid { grid-template-columns: 1fr; }
    .card-content { flex-direction: row; align-items: center; gap: 12px; }
    .cover-art { width: 85px; height: 85px; padding: 5px; border-radius: 12px; }
    .playlist-info { padding-right: 0; }
    .playlist-info h3 { font-size: 1.4rem !important; }
    .playlist-info p { font-size: 0.85rem; margin: 6px 0; }
    .btn-group { display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: space-between; gap: 8px; }
    .btn { flex: 1; font-size: 0.70rem; padding: 10px 5px; box-shadow: 2px 2px 0 var(--stroke); white-space: nowrap; }
    .cassette-mechanism { gap: 25px; padding: 10px; margin-top: 10px; }
    .reel { width: 35px; height: 35px; }
    .playlist-card { padding: 15px; }
    .btn-edit { width: 32px; height: 32px; font-size: 0.85rem; top: 12px; right: 12px; }
    .concert-header { padding-top: 48px; } 
    .pass-badge { top: 25px; right: -60px; width: 190px; font-size: 0.65rem; }
    .concert-header h2 { font-size: 1.6rem !important; }
    .pass-details { font-size: 0.85rem; }
    .slideshow img { height: 180px; }
}
</style>
</head>

<script>
let playlistsData = [];
let isSpotifyApiReady = false;
let editingIndex = -1;

function togglePlayerVisibility(btn) {
    const card = btn.closest('.playlist-card');
    const player = card.querySelector('.player-container');
    const reels = card.querySelectorAll('.reel');

    if (player.style.display === "none" || player.style.display === "") {
        player.style.display = "block";
        btn.innerHTML = "Chiudi ⏹️";
    } else {
        player.style.display = "none";
        btn.innerHTML = "Preview 🎧"; 
        reels.forEach(r => r.classList.remove("spinning"));
    }
}

// Genera l'URI corretto per Spotify
function generateSpotifyUri(link) {
    if (link.startsWith('spotify:')) return link;
    try {
        const url = new URL(link);
        const host = url.hostname.toLowerCase();
        
        if (host.includes('spotify.com') || link.includes('spotify.com')) {
            const pathParts = url.pathname.split('/').filter(p => p);
            if (pathParts.length >= 2) {
                const type = pathParts[0];
                const id = pathParts[1];
                return `spotify:${type}:${id}`;
            }
        }
        return link;
    } catch(e) {
        return link;
    }
}

// Capisce che tipo di link è stato inserito
function getLinkType(link) {
    try {
        if (link.startsWith('spotify:')) return 'spotify';
        const url = new URL(link);
        const host = url.hostname.toLowerCase();
        
        if (host.includes('spotify.com') || link.includes('spotify.com')) return 'spotify';
        if (host.includes('youtube.com') || host.includes('youtu.be')) return 'youtube';
        if (host.includes('amazon') || host.includes('amzn.to')) return 'amazon'; 
        
        return 'web';
    } catch(e) {
        return 'web';
    }
}

function getOpenButtonIcon(type) {
    const icons = {

// Estrae in modo intelligente gli ID dei video, shorts o delle playlist di YouTube abilitando le JS API
function getYoutubeEmbedUrl(link) {
    try {
        let resUrl = link;
        if (link.includes('<iframe') && link.includes('src="')) {
            const match = link.match(/src="([^"]+)"/);
            if (match) resUrl = match[1];
        }

        if (!resUrl.startsWith('http://') && !resUrl.startsWith('https://')) {
            if (resUrl.includes('youtube.com') || resUrl.includes('youtu.be')) {
                resUrl = 'https://' + resUrl;
            } else {
                return link;
            }
        }

        const url = new URL(resUrl);
        const host = url.hostname.toLowerCase();
        let videoId = "";
        let listId = url.searchParams.get('list');
        
        if (host.includes('youtu.be')) {
            videoId = url.pathname.split('/').filter(p => p)[0];
        } else if (host.includes('youtube.com')) {
            if (url.pathname.includes('/shorts/')) {
                videoId = url.pathname.split('/shorts/')[1].split('/')[0];
            } else if (url.pathname.includes('/embed/')) {
                videoId = url.pathname.split('/embed/')[1].split('?')[0];
            } else {
                videoId = url.searchParams.get('v');
            }
        }

        let embedBase = "";
        if (listId && videoId) {
            embedBase = `https://www.youtube-nocookie.com/embed/${videoId}?list=${listId}`;
        } else if (listId) {
            embedBase = `https://www.youtube-nocookie.com/embed/videoseries?list=${listId}`;
        } else if (videoId) {
            embedBase = `https://www.youtube-nocookie.com/embed/${videoId}`;
        } else {
            embedBase = resUrl.replace('youtube.com', 'youtube-nocookie.com');
        }
        
        const finalUrl = new URL(embedBase);
        finalUrl.searchParams.set('enablejsapi', '1');
        return finalUrl.toString();
    } catch(e) {
        return link;
    }
}

// Converte i link web standard di Amazon Music (inclusi quelli con /music/player/) in sorgenti embed funzionanti
function getAmazonEmbedUrl(link) {
    try {
        if (link.includes('<iframe') && link.includes('src="')) {
            const match = link.match(/src="([^"]+)"/);
            if (match) return match[1];
        }
        const url = new URL(link);
        if (url.pathname.includes('/embed/')) return link;
        
        if (url.hostname.includes('music.amazon') || url.hostname.includes('amazon.')) {
            let path = url.pathname;
            
            // Rimuove la sottocartella /music/player se presente nei link moderni copiati da browser/app
            if (path.includes('/music/player')) {
                path = path.replace('/music/player', '');
            }
            
            // Amazon embed player richiede tassativamente /playlists/ invece di /user-playlists/
            if (path.includes('/user-playlists/')) {
                path = path.replace('/user-playlists/', '/playlists/');
            }
            
            let hostname = url.hostname;
            if (!hostname.startsWith('music.')) {
                hostname = 'music.' + hostname;
            }
            
            return `https://${hostname}/embed${path}${url.search}`;
        }
        return link;
    } catch(e) {
        return link;
    }
}

async function fetchPlaylists() {
    try {
        const res = await fetch(`playlist.json?v=${new Date().getTime()}`);
        if(res.ok) {
            playlistsData = await res.json();
            renderPlaylists();
        }
    } catch(err) {
        console.error("Errore di rete durante il fetch:", err);
    }
}

function renderPlaylists() {
    const container = document.getElementById('playlist-container');
    container.innerHTML = ''; 

    playlistsData.forEach((p, index) => {
        const linkType = getLinkType(p.linkSpotify);
        const hasPreview = linkType === 'spotify' || linkType === 'youtube' || linkType === 'amazon';
        const previewButton = hasPreview ? `<button class="btn btn-play" onclick="togglePlayerVisibility(this)">Preview 🎧</button>` : '';
        const openIcon = getOpenButtonIcon(linkType);
        
        const playerMarkup = linkType === 'spotify'
            ? `<div class="spotify-embed" data-spotify-uri="${p.uriSpotify}" id="embed-${index}"></div>`
            : linkType === 'youtube'
                ? `<div class="youtube-embed"><iframe src="${getYoutubeEmbedUrl(p.linkSpotify)}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe></div>`
                : linkType === 'amazon'
                    ? `<div class="amazon-embed"><iframe src="${getAmazonEmbedUrl(p.linkSpotify)}" title="Amazon Music player" frameborder="0" allow="autoplay" loading="lazy"></iframe></div>`
                    : '';
                
        const coverStyle = `--cover-base: ${p.stile.color};`;

        const html = `
        <div class="playlist-card">
            <button class="btn-edit" onclick="openEditModal(${index})" title="Modifica Cassetta">✏️</button>
            <div class="card-content">
                <div class="cover-art ${p.stile.classe}" style="${coverStyle} --char-count: ${p.nome.length};">
                    <span class="cover-text">${p.nome}</span>
                </div>
                <div class="playlist-info">
                    <h3 style="font-family: 'Grandstander'; font-size: 1.5rem; margin:0; color: ${p.stile.color};">${p.nome}</h3>
                    <p style="color:#666; margin: 8px 0;">${p.descrizione}</p>
                    <div class="btn-group">
                        <a href="${p.linkSpotify}" target="_blank" class="btn btn-link">
                            ${openIcon}
                            Apri
                        </a>
                        ${previewButton}
                    </div>
                </div>
            </div>
            <div class="cassette-mechanism">
                <div class="reel"></div>
                <div class="reel"></div>
            </div>
            <div class="player-container">
              ${playerMarkup}
            </div>
        </div>`;
        container.innerHTML += html;
    });

    if (isSpotifyApiReady && window.SpotifyIframeApi) {
        initSpotifyPlayers(window.SpotifyIframeApi);
    }
}

window.onSpotifyIframeApiReady = (IFrameAPI) => {
    isSpotifyApiReady = true;
    window.SpotifyIframeApi = IFrameAPI;
    if(playlistsData.length > 0) {
        initSpotifyPlayers(IFrameAPI);
    }
};

function initSpotifyPlayers(IFrameAPI) {
    const cards = document.querySelectorAll('.playlist-card');
    cards.forEach(card => {
        const embedElement = card.querySelector('.spotify-embed');
        if (!embedElement) return; 
        if (embedElement.hasAttribute('data-initialized')) return; 

        const uri = embedElement.getAttribute('data-spotify-uri');
        const reels = card.querySelectorAll('.reel');
        const options = { width: '100%', height: '80', uri: uri };
        
        const callback = (EmbedController) => {
            EmbedController.addListener('playback_update', e => {
                if (e.data.isPaused || e.data.isBuffering) {
                    reels.forEach(r => r.classList.remove("spinning"));
                } else {
                    reels.forEach(r => r.classList.add("spinning"));
                }
            });
        };
        
        IFrameAPI.createController(embedElement, options, callback);
        embedElement.setAttribute('data-initialized', 'true');
    });
}

// Ascolta i messaggi postMessage inviati dall'Iframe di YouTube per far girare le rotelle solo in Play effettivo
window.addEventListener('message', (event) => {
    if (!event.origin.includes('youtube')) return;
    try {
        let data = event.data;
        if (typeof data === 'string') {
            data = JSON.parse(data);
        }
        if (data && data.event === 'infoDelivery' && data.info) {
            const state = data.info.playerState;
            if (state !== undefined) {
                const iframes = document.querySelectorAll('.youtube-embed iframe');
                iframes.forEach(iframe => {
                    if (iframe.contentWindow === event.source) {
                        const card = iframe.closest('.playlist-card');
                        if (card) {
                            const reels = card.querySelectorAll('.reel');
                            if (state === 1) { // 1 = in riproduzione (playing)
                                reels.forEach(r => r.classList.add("spinning"));
                            } else { // in pausa, buffering o terminato
                                reels.forEach(r => r.classList.remove("spinning"));
                            }
                        }
                    }
                });
            }
        }
    } catch (e) {
        // Ignora gli errori di parsing derivati da altri tipi di messaggi sul canale postMessage
    }
});

const modalOverlay = document.getElementById("modal-cd-overlay");

document.getElementById("btn-add-playlist").onclick = () => {
    editingIndex = -1;
    document.getElementById("modal-title").innerText = "Nuova Playlist";
    document.getElementById("btn-cd-ok").innerHTML = "Salva ⏺️";
    document.getElementById("btn-cd-delete").style.display = "none";
    document.getElementById("new-nome").value = "";
    document.getElementById("new-desc").value = "";
    document.getElementById("new-link").value = "";
    document.getElementById("new-color").value = "#0000ff";
    modalOverlay.style.display = "flex";
};

window.openEditModal = function(index) {
    editingIndex = index;
    const p = playlistsData[index];
    document.getElementById("modal-title").innerText = "Modifica Playlist";
    document.getElementById("btn-cd-ok").innerHTML = "Aggiorna 🔄";
    document.getElementById("btn-cd-delete").style.display = "inline-flex";
    document.getElementById("new-nome").value = p.nome;
    document.getElementById("new-desc").value = p.descrizione;
    document.getElementById("new-link").value = p.linkSpotify;
    document.getElementById("new-color").value = p.stile?.color || '#0000ff';
    modalOverlay.style.display = "flex";
};

document.getElementById("btn-cd-cancel").onclick = () => {
    modalOverlay.style.display = "none";
};

document.getElementById("btn-cd-ok").onclick = async () => {
    const btnOk = document.getElementById("btn-cd-ok");
    const nome = document.getElementById("new-nome").value;
    const desc = document.getElementById("new-desc").value;
    const link = document.getElementById("new-link").value;
    const color = document.getElementById("new-color").value || '#0000ff';

    if (!nome || !desc || !link) {
        alert("Ops! Compila tutti i campi prima di procedere.");
        return;
    }

    const generatedUri = generateSpotifyUri(link);
    btnOk.innerText = "Salvataggio...";
    btnOk.disabled = true;

    let arrayAggiornato = [...playlistsData];

    if (editingIndex === -1) {
        const stiliPossibili = [
            { classe: "cover-883", color: "#0000ff" },
            { classe: "cover-cartoni", color: "#ff4757" },
            { classe: "cover-gemboy", color: "#b8af00" },
            { classe: "cover-vasco", color: "#004f2a" },
            { classe: "cover-random1", color: "#fd1d1d" },
            { classe: "cover-random2", color: "#00C9FF" },
            { classe: "cover-random3", color: "#f5af19" }
        ];
        const stileRandom = stiliPossibili[Math.floor(Math.random() * stiliPossibili.length)];

        arrayAggiornato.push({
            nome: nome,
            descrizione: desc,
            linkSpotify: link,
            uriSpotify: generatedUri,
            stile: {
                classe: stileRandom.classe,
                color: color
            }
        });
    } else {
        arrayAggiornato[editingIndex].nome = nome;
        arrayAggiornato[editingIndex].descrizione = desc;
        arrayAggiornato[editingIndex].linkSpotify = link;
        arrayAggiornato[editingIndex].uriSpotify = generatedUri;
        arrayAggiornato[editingIndex].stile = {
            ...arrayAggiornato[editingIndex].stile,
            color: color
        };
    }

    try {
        const apiURL = "https://tisbatuffoblog.vercel.app/api/update_musicAPI"; 
        const res = await fetch(apiURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(arrayAggiornato)
        });
        if (res.ok) {
            playlistsData = arrayAggiornato;
            renderPlaylists();
            modalOverlay.style.display = "none";
        }
    } catch(err) {
        alert("Errore di connessione.");
    } finally {
        btnOk.innerText = editingIndex === -1 ? "Registra ⏺️" : "Aggiorna 🔄";
        btnOk.disabled = false;
    }
};

document.getElementById("btn-cd-delete").onclick = async () => {
    if (confirm("Sei sicuro di voler eliminare questa cassetta?")) {
        const btnDelete = document.getElementById("btn-cd-delete");
        btnDelete.innerText = "Eliminazione...";
        btnDelete.disabled = true;

        let arrayAggiornato = [...playlistsData];
        arrayAggiornato.splice(editingIndex, 1);

        try {
            const apiURL = "https://tisbatuffoblog.vercel.app/api/update_musicAPI"; 
            const res = await fetch(apiURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(arrayAggiornato)
            });
            if (res.ok) {
                playlistsData = arrayAggiornato;
                renderPlaylists();
                modalOverlay.style.display = "none";
            }
        } catch(err) {
            alert("Errore.");
        } finally {
            btnDelete.innerText = "Elimina 🗑️";
            btnDelete.disabled = false;
        }
    }
};

function loadConcertImages(folderName, containerId) {
    const container = document.getElementById(containerId);
    let currentIndex = 1;
    function tryLoadNextImage() {
        const img = new Image();
        const imagePath = `img/${folderName}/${folderName} (${currentIndex}).jpg`;
        img.onload = function() {
            img.alt = `Foto ${folderName} ${currentIndex}`;
            container.appendChild(img);
            currentIndex++;
            if (currentIndex <= 50) { tryLoadNextImage(); } 
        };
        img.src = imagePath;
    }
    tryLoadNextImage();
}

document.addEventListener("DOMContentLoaded", () => {
    fetchPlaylists(); 
    loadConcertImages('vasco', 'slideshow-vasco');
    loadConcertImages('cristina', 'slideshow-cristina');
    loadConcertImages('gemboy', 'slideshow-gemboy');
});
