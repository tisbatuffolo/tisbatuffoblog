<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SbatuffoBlog - PandaGames</title>

<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #19af4e; 
  --sbatuffo-blue: #0000ff;
  --accent: #ff4757;
  --bg-soft: #fdfdfd;
  --text: #1a1a1a;
  --stroke: #1a1a1a;
  --heart-red: #ff4d4d;
}

body { 
    font-family: 'Fredoka', sans-serif; 
    margin: 0; 
    background: var(--bg-soft); 
    color: var(--text); 
    overflow-x: hidden; 
    text-align: center;
}

/* --- HEADER --- */
header {
  background: #fff;
  padding: 25px 10px 5px;
  position: relative;
  text-align: center;
}

.header-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  position: relative;
}

.brand-title {
  font-family: 'Grandstander', cursive;
  font-weight: 900;
  font-size: clamp(2.2rem, 8vw, 4.2rem);
  color: var(--sbatuffo-blue);
  text-decoration: none;
  line-height: 1;
  display: block;
}

.brand-subtitle {
  font-size: clamp(0.9rem, 3vw, 1.2rem);
  color: var(--primary);
  font-weight: 700;
  margin-top: 5px;
  letter-spacing: 1.5px;
  text-transform: lowercase;
}

/* --- DIVISORI --- */
.section-divider {
  max-width: 200px;
  height: 3px;
  background: linear-gradient(to right, var(--primary) 0 calc(50% - 30px), transparent calc(50% - 30px) calc(50% + 30px), var(--primary) calc(50% + 30px) 100%);
  margin: 40px auto; 
  border-radius: 50px;
  position: relative;
}
.section-divider::after {
  content: "♥";
  position: absolute;
  top: -14px; left: 50%;
  transform: translateX(-50%);
  background: transparent;
  padding: 0 15px;
  color: var(--heart-red);
  font-size: 1.5rem;
}

/* --- CONTENT & GAME CARDS --- */
.content {
    margin: 0 auto; 
    padding: 0 20px;
    position: relative;
    max-width: 800px;
}

.game-title {
    font-family: 'Grandstander', cursive;
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 900;
    color: var(--text);
    margin-bottom: 15px;
    line-height: 1.1;
}

.game-card {
    background: #ffffff;
    border: 8px solid var(--stroke);
    border-radius: 28px;
    padding: 0;
    max-width: 360px;
    margin: 0 auto;
    box-shadow: 0 10px 0 var(--stroke);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
}

.game-card:hover {
    transform: translateY(-4px) rotate(0.5deg);
    box-shadow: 0 14px 0 var(--stroke);
}

.game-preview-link {
    display: block;
    width: 100%;
    background: #f2f2f2;
    text-decoration: none;
    border-bottom: 4px solid var(--stroke);
    cursor: pointer;
}

.game-preview {
    display: block;
    width: 100%;
    height: 220px;
    background: #eee;
    object-fit: cover;
    transition: transform 0.25s ease;
}

.game-preview-link:hover .game-preview {
    transform: scale(1.02);
}

.game-card-actions {
    padding: 18px 20px 20px;
    text-align: center;
}

.play-btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-family: 'Grandstander', cursive;
    font-size: 1.4rem;
    font-weight: 900;
    text-decoration: none;
    padding: 10px 30px;
    border-radius: 50px;
    border: 2px solid var(--stroke);
    box-shadow: 0 4px 0px var(--stroke);
    transition: all 0.1s ease;
}

.play-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0px 0px var(--stroke);
}

/* --- FOOTER --- */
footer { 
    background: #fff; 
    padding: 20px 10px 40px; 
    border-top: 1px solid #eee;
    margin-top: 50px;
}
.footer-container { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    position: relative; 
    max-width: 1100px; 
    margin: 0 auto; 
}
.footer-text { 
    font-family: 'Grandstander', cursive; 
    font-weight: 600; 
    font-size: 1.2rem; 
    color: #444; 
    text-align: center;
}
.footer-home-link { 
  text-decoration: none; 
  color: inherit; 
  display: inline-flex; 
  align-items: center; 
  gap: 8px; 
  vertical-align: middle;
  transition: transform 0.2s ease;
}
.footer-home-link:hover { transform: scale(1.05); }
.footer-home-link img { width: 60px; height: auto; }
</style>
</head>

<body>

<div class="section-divider"></div>

<main class="content">

      <img src="img/pandarun-prev.png" alt="Anteprima Pandarun" class="game-preview">
    </a>
    <div class="game-card-actions">
      <a href="pandarun/pandarun.html" class="play-btn">PLAY!</a>

  <div class="section-divider"></div>

  <!-- GIOCO 2: PANDATETRIS -->

    </a>
    <div class="game-card-actions">

    </a>
    <div class="game-card-actions">
      <a href="pandapoops/pandapoops.html" class="play-btn">PLAY!</a>

  <div class="section-divider"></div>

    </a>
    <div class="game-card-actions">

    </div>
  </div>

</main>

<div class="section-divider" style="margin-bottom: 80px;"></div>

<footer>
    <div class="footer-container">
    <div class="footer-text">
      @SbatuffoBlog 2026 - 
      <a href="../index.html" class="footer-home-link">
        Home <img src="img/home.png" alt="Home">
      </a>
    </div>
  </div>
</footer>

</body>
</html>
