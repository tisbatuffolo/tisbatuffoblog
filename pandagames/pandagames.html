<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SbatuffoBlog - PandaGames</title>

<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #19af4e; 
  --sbatuffo-blue: #0000ff;
  --accent: #ff4757;
  --bg-soft: #fdfdfd;
  --text: #1a1a1a;
  --stroke: #1a1a1a;
  --heart-red: #ff4d4d;
}

body { 
    font-family: 'Fredoka', sans-serif; 
    margin: 0; 
    background: var(--bg-soft); 
    color: var(--text); 
    overflow-x: hidden; 
    text-align: center;
}

/* --- HEADER --- */
header {
  background: #fff;
  padding: 25px 10px 5px;
  position: relative;
  text-align: center;
}

.header-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  position: relative;
}

.brand-title {
  font-family: 'Grandstander', cursive;
  font-weight: 900;
  font-size: clamp(2.2rem, 8vw, 4.2rem);
  color: var(--sbatuffo-blue);
  text-decoration: none;
  line-height: 1;
  display: block;
}

.brand-subtitle {
  font-size: clamp(0.9rem, 3vw, 1.2rem);
  color: var(--primary);
  font-weight: 700;
  margin-top: 5px;
  letter-spacing: 1.5px;
  text-transform: lowercase;
}

/* --- DIVISORI --- */
.section-divider {
  max-width: 200px;
  height: 3px;
  background: linear-gradient(to right, var(--primary) 0 calc(50% - 30px), transparent calc(50% - 30px) calc(50% + 30px), var(--primary) calc(50% + 30px) 100%);
  margin: 40px auto; 
  border-radius: 50px;
  position: relative;
}
.section-divider::after {
  content: "♥";
  position: absolute;
  top: -14px; left: 50%;
  transform: translateX(-50%);
  background: transparent;
  padding: 0 15px;
  color: var(--heart-red);
  font-size: 1.5rem;
}

/* --- CONTENT & CONSOLE GAME CARDS --- */
.content {
    margin: 0 auto; 
    padding: 0 20px;
    position: relative;
    max-width: 800px;
}

.game-title {
    font-family: 'Grandstander', cursive;
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 900;
    color: var(--text);
    margin-bottom: 15px;
    line-height: 1.1;
}

.game-card {
    background: #181a20;
    border: 8px solid var(--stroke);
    border-radius: 36px;
    padding: 16px 10px;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 12px 0 var(--stroke);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    position: relative;
    overflow: hidden;
}

.game-card:hover {
    transform: translateY(-4px) rotate(0.5deg);
    box-shadow: 0 16px 0 var(--stroke);
}

/* Joy-Con Styles */
.joycon {
    width: 60px;
    height: 190px;
    min-height: 0;
    border-radius: 18px;
    border: 4px solid var(--stroke);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 16px 4px;
    box-sizing: border-box;
    position: relative;
}

.left-jc {
    background: var(--sbatuffo-blue); /* Joy-Con Sbatuffo Blue */
}

.right-jc {
    background: #ff334b; /* Joy-Con Rosso */
}

/* Thumbstick (Levetta) */
.thumbstick {
    width: 32px;
    height: 32px;
    background: #111;
    border: 3px solid var(--stroke);
    border-radius: 50%;
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.2), 0 3px 0 var(--stroke);
    position: relative;
}
.thumbstick::after {
    content: "";
    position: absolute;
    top: 6px; left: 6px;
    width: 14px; height: 14px;
    background: #333;
    border-radius: 50%;
}

/* D-Pad (Croce Direzionale) */
.dpad {
    width: 36px;
    height: 36px;
    background: #111;
    border: 3px solid var(--stroke);
    border-radius: 8px;
    position: relative;
    box-shadow: 0 3px 0 var(--stroke);
}
.dpad::before, .dpad::after {
    content: "";
    position: absolute;
    background: #222;
}
.dpad::before {
    top: 4px; left: 11px; width: 10px; height: 20px;
}
.dpad::after {
    top: 11px; left: 4px; width: 20px; height: 10px;
}

/* ABXY Buttons */
.action-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    width: 38px;
    height: 38px;
    justify-items: center;
    align-items: center;
}

.btn-xyab {
    width: 16px;
    height: 16px;
    background: #111;
    border: 2px solid var(--stroke);
    border-radius: 50%;
    color: #fff;
    font-size: 8px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 0 var(--stroke);
}

/* Screen Container */
.console-screen-container {
    flex: 1;
    background: #000;
    border: 4px solid var(--stroke);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
    margin-top: 0;
    margin-bottom: 0;
}

.game-preview-link {
    display: block;
    width: 100%;
    background: #000;
    text-decoration: none;
    cursor: pointer;
    line-height: 0;
}

.game-preview {
    display: block;
    width: 100%;
    height: 190px;
    object-fit: cover;
    transition: transform 0.25s ease;
    background: #000;
}

.game-preview-link:hover .game-preview {
    transform: scale(1.03);
}

.game-card-actions {
    padding: 0;
    text-align: center;
    background: #000;
    border-top: 0;
    width: 100%;
}

.play-btn {
    display: block;
    width: 100%;
    background: var(--primary);
    color: #fff;
    font-family: 'Grandstander', cursive;
    font-size: 1.3rem;
    font-weight: 900;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 0;
    border: 0;
    box-shadow: none;
    transition: all 0.1s ease;
    box-sizing: border-box;
}

.play-btn:active {
    transform: translateY(2px);
    box-shadow: none;
        width: 48px;
        padding: 10px 2px;
    }
    .thumbstick {
        width: 26px; height: 26px;
    }
    .dpad {
        width: 28px; height: 28px;
    }
    .action-buttons {
        width: 30px; height: 30px;
    }
    .btn-xyab {
        width: 13px; height: 13px; font-size: 6px;
    }
    .console-screen-container {
        border-width: 4px;
    }
    .game-preview {
        height: 152px;
        aspect-ratio: 16 / 10;
    }
    .play-btn {
        font-size: 1.05rem;
        padding: 10px 12px;
    }
}

/* --- FOOTER --- */
footer { 
    background: #fff; 
    padding: 20px 10px 40px; 
    border-top: 1px solid #eee;
    margin-top: 50px;
}
.footer-container { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    position: relative; 
    max-width: 1100px; 
    margin: 0 auto; 
}
.footer-text { 
    font-family: 'Grandstander', cursive; 
    font-weight: 600; 
    font-size: 1.2rem; 
    color: #444; 
    text-align: center;
}
.footer-home-link { 
  text-decoration: none; 
  color: inherit; 
  display: inline-flex; 
  align-items: center; 
  gap: 8px; 
  vertical-align: middle;
  transition: transform 0.2s ease;
}
.footer-home-link:hover { transform: scale(1.05); }
.footer-home-link img { width: 60px; height: auto; }
</style>
</head>
