<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SbatuffoBlog - PandaTetris</title>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #19af4e; 
  --sbatuffo-blue: #0056ff;
  --accent: #ff4757;
  --bg-soft: #ffffff;
  --text: #1a1a1a;
  --stroke: #1a1a1a;
}

body, html { 
    font-family: 'Fredoka', sans-serif; 
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-soft); 
    color: var(--text); 
    overflow: hidden; 
    text-align: center;
    touch-action: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    position: relative;
}

#ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
}

#left-controls {
    position: absolute;
    top: 12px;
    left: 15px;
    display: flex;
    gap: 6px;
    align-items: center;
    z-index: 10;
    pointer-events: auto;
}

#game-title {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 34px;
    color: var(--sbatuffo-blue);
    font-weight: 900;
    font-family: 'Grandstander', cursive;
    text-shadow: 2px 2px 0 #ffffff, 3px 3px 0 #333;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
}

#right-controls {
    position: absolute;
    top: 12px;
    right: 15px;
    display: flex;
    gap: 6px;
    align-items: center;
    z-index: 10;
    pointer-events: auto;
}

.top-btn {
    width: 32px;
    height: 32px;
    color: white;
    font-weight: 900;
    border: 2px solid #333;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 3px 0 #333;
    cursor: pointer;
    transition: transform 0.1s ease;
    font-family: 'Grandstander', cursive;
    background: #19af4e;
}

.top-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 #333;
}

#info-btn { background: #3742fa; font-size: 14px; font-style: italic; }
#leaderboard-btn { background: #fbc531; font-size: 13px; }
#pause-btn { background: #ffa502; font-size: 13px; }
#close-btn { background: #ff4757; font-size: 14px; }

#score-container {
    position: relative;
    margin-top: 10px;
    font-size: 14px;
    color: #333;
    font-weight: 900;
    font-family: 'Grandstander', cursive;
    background: #f4f4f4;
    padding: 4px 14px;
    border-radius: 12px;
    border: 2px solid var(--stroke);
    pointer-events: auto;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    text-align: center;
    z-index: 20;
    display: inline-block;
    transition: transform 0.2s ease, background-color 0.2s ease;
}

#score-container span {
    color: var(--accent);
}

@keyframes levelFlash {
    0% { background: #ffeaa7; transform: scale(1.08); }
    50% { background: #ff7675; transform: scale(1.15); color: white; }
    100% { background: #f4f4f4; transform: scale(1); color: #333; }
}

.level-flash {
    animation: levelFlash 0.6s ease;
}

.modal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: white;
    padding: 25px;
    border-radius: 20px;
    border: 4px solid #1a1a1a;
    box-shadow: 0 10px 0 #1a1a1a;
    display: none;
    pointer-events: auto;
    z-index: 60;
    max-width: 300px;
    width: 80%;
}

.modal h2 { margin: 0 0 15px; color: #3742fa; font-size: 22px; font-family: 'Grandstander', cursive; }
.modal p { font-size: 14px; color: #333; line-height: 1.4; margin-bottom: 20px; font-weight: 600; font-family: 'Fredoka', sans-serif; }

#game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: white;
    padding: 25px;
    border-radius: 20px;
    border: 4px solid #1a1a1a;
    box-shadow: 0 10px 0 #1a1a1a;
    display: none;
    pointer-events: auto;
    z-index: 60;
    max-width: 300px;
    width: 80%;
}

#game-over h1 { margin: 0 0 15px; color: #ff4757; font-size: 26px; font-family: 'Grandstander', cursive; }
#game-over p { font-size: 15px; font-family: 'Fredoka', sans-serif; font-weight: 600; color: #333; margin-bottom: 20px; }

.btn {
    background: #19af4e;
    color: white;
    border: 2px solid #1a1a1a;
    padding: 10px 20px;
    font-size: 16px;
    font-family: 'Grandstander', cursive;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 3px 0 #1a1a1a;
    text-decoration: none;
    display: inline-block;
    margin: 4px;
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 #1a1a1a;
}

.game-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-top: 75px;
    box-sizing: border-box;
    flex: 1;
}

/* --- PANDA CON LAVAGNETTA (Zampe più grandi, impronte chiare, bordo lavagna meno scuro) --- */
.panda-wrapper { 
    position: relative; 
    max-width: 380px; 
    margin: 30px auto 0 auto; 
    z-index: 5; 
    width: 96%; 
}
.panda-head { 
    position: absolute; 
    top: -55px; 
    left: 50%; 
    transform: translateX(-50%); 
    width: 105px; 
    height: 75px; 
    background: #fff; 
    border: 3px solid var(--stroke); 
    border-radius: 38px 38px 32px 32px; 
    z-index: 10; 
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.05); 
}
.panda-ear { 
    position: absolute; 
    width: 28px; 
    height: 28px; 
    background: #1c1c1c; 
    border: 3px solid var(--stroke); 
    border-radius: 50%; 
    top: -5px; 
    z-index: -1; 
}
.panda-ear.left { left: -5px; } 
.panda-ear.right { right: -5px; }
.panda-eye { 
    position: absolute; 
    width: 23px; 
    height: 28px; 
    background: #1c1c1c; 
    border-radius: 50%; 
    top: 22px; 
}
.panda-eye.left { left: 14px; transform: rotate(-20deg); } 
.panda-eye.right { right: 14px; transform: rotate(20deg); }
.panda-eye-sparkle { 
    position: absolute; 
    width: 6px; 
    height: 6px; 
    background: #fff; 
    border-radius: 50%; 
    top: 4px; 
    right: 4px; 
}
.panda-nose { 
    position: absolute; 
    width: 12px; 
    height: 7px; 
    background: #1c1c1c; 
    border-radius: 50%; 
    top: 50px; 
    left: 50%; 
    transform: translateX(-50%); 
}
.panda-mouth { 
    position: absolute; 
    width: 15px; 
    height: 5px; 
    border-bottom: 3px solid #1c1c1c; 
    border-radius: 0 0 25px 25px; 
    top: 56px; 
    left: 50%; 
    transform: translateX(-50%); 
}
.panda-blush { 
    position: absolute; 
    width: 13px; 
    height: 8px; 
    background: #ffb3ba; 
    border-radius: 50%; 
    top: 43px; 
    opacity: 0.6; 
    filter: blur(2px); 
}
.panda-blush.left { left: 5px; } 
.panda-blush.right { right: 5px; }

/* Mani superiori più grandi e con impronte più chiare ed evidenti */
.panda-paw-top {
    position: absolute;
    width: 42px;
    height: 35px;
    background: #1c1c1c;
    border: 3px solid var(--stroke);
    border-radius: 50%;
    top: -14px;
    z-index: 15;
    box-shadow: 0 2px 0 var(--stroke), inset 0 2px 0 rgba(255,255,255,0.2);
}
.panda-paw-top.left { left: 16px; transform: rotate(-10deg); }
.panda-paw-top.right { right: 16px; transform: rotate(10deg); }

.panda-paw-pad-top {
    position: absolute;
    width: 16px;
    height: 11px;
    background: #747d8c;
    border-radius: 50%;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
}
.panda-paw-pad-top::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    background: #747d8c;
    border-radius: 50%;
    box-shadow: -6px 2px 0 -1px #747d8c, 6px 2px 0 -1px #747d8c;
}

/* Piedi inferiori più grandi e con impronte più chiare ed evidenti */
.panda-paw-bottom {
    position: absolute;
    width: 52px;
    height: 42px;
    background: #1c1c1c;
    border: 3px solid var(--stroke);
    border-radius: 40% 40% 50% 50%;
    bottom: -20px;
    z-index: 15;
    box-shadow: 0 3px 0 var(--stroke), inset 0 2px 0 rgba(255,255,255,0.2);
}
.panda-paw-bottom.left { left: 16px; transform: rotate(-5deg); }
.panda-paw-bottom.right { right: 16px; transform: rotate(5deg); }

.panda-paw-pad {
    position: absolute;
    width: 20px;
    height: 14px;
    background: #747d8c;
    border-radius: 50%;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
}
.panda-paw-pad::before {
    content: '';
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    background: #747d8c;
    border-radius: 50%;
    box-shadow: -9px 2px 0 -1px #747d8c, 9px 2px 0 -1px #747d8c;
}

/* Contorno lavagna con colore meno marron scuro */
.lavagnetta-container { 
    position: relative; 
    background: #8B5A2B; 
    border: 3px solid var(--stroke); 
    border-radius: 12px; 
    padding: 6px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.12), 3px 3px 0px var(--primary); 
    z-index: 5; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
}

/* Area di gioco */
.lavagnetta-screen {
    position: relative;
    width: 340px;
    height: 476px;
    background: #000000;
    border: 2px solid #1a1a1a;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin: 0 auto;
}

canvas {
    width: 100%;
    height: 100%;
    background: #000000;
    display: block;
}
</style>
</head>
<body>

<div id="ui-layer">
    <div id="left-controls">
        <button id="info-btn" class="top-btn" title="Info">i</button>
        <button id="leaderboard-btn" class="top-btn" title="Classifica">🏆</button>
    </div>
    
    <div id="game-title">PandaTetris</div>
    
    <div id="right-controls">
        <button id="pause-btn" class="top-btn" title="Pausa">⏸</button>
        <a href="../pandagames.html" id="close-btn" class="top-btn" title="Esci">✕</a>
    </div>

    <div id="info-modal" class="modal">
        <h2>Come Giocare 🐼</h2>
        <p id="info-text">Caricamento...</p>
        <button class="btn" onclick="closeModal('info-modal')" style="font-size: 14px; width: 140px; padding: 8px;">Capito!</button>
    </div>

    <div id="leaderboard-modal" class="modal">
        <h2>Classifica 🏆</h2>
        <p>Le classifiche online saranno disponibili presto con una nuova API dedicata!</p>
        <button class="btn" onclick="closeModal('leaderboard-modal')" style="font-size: 14px; width: 140px; padding: 8px;">Chiudi</button>
    </div>
</div>

<div class="game-container">
    <div class="panda-wrapper">
        <div class="panda-head">
            <div class="panda-ear left"></div>
            <div class="panda-ear right"></div>
            <div class="panda-eye left"><div class="panda-eye-sparkle"></div></div>
            <div class="panda-eye right"><div class="panda-eye-sparkle"></div></div>
            <div class="panda-blush left"></div>
            <div class="panda-blush right"></div>
            <div class="panda-nose"></div>
            <div class="panda-mouth"></div>
        </div>
        
        <div class="panda-paw-top left"><div class="panda-paw-pad-top"></div></div>
        <div class="panda-paw-top right"><div class="panda-paw-pad-top"></div></div>

        <div class="lavagnetta-container">
            <div class="lavagnetta-screen">
                <canvas id="tetris" width="340" height="476"></canvas>
            </div>
        </div>

        <div class="panda-paw-bottom left"><div class="panda-paw-pad"></div></div>
        <div class="panda-paw-bottom right"><div class="panda-paw-pad"></div></div>
    </div>

    <div id="score-container">
        Punti: <span id="score">0</span> &nbsp;|&nbsp; Livello: <span id="level">1</span>
    </div>

    <div id="game-over">
        <h1>Ops! Perso!</h1>
        <p>Punteggio finale: <span id="final-score">0</span></p>
        <button class="btn" onclick="resetGame()" style="font-size: 14px; width: 180px; padding: 8px; box-sizing: border-box;">Rigioca 🐼</button>
        <br><br>
        <a href="../pandagames.html" class="btn" style="background:#ff4757; font-size:14px; width:180px; padding:8px; box-sizing:border-box;">Torna ai<br>Panda Games</a>
    </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
context.scale(340 / 12, 476 / 17);

const scoreElement = document.getElementById('score');
const levelElement = document.getElementById('level');
const scoreContainer = document.getElementById('score-container');
const finalScoreElement = document.getElementById('final-score');
const gameOverScreen = document.getElementById('game-over');
const pauseBtn = document.getElementById('pause-btn');
const infoModal = document.getElementById('info-modal');
const leaderboardModal = document.getElementById('leaderboard-modal');
const infoTextEl = document.getElementById('info-text');

const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isMobile) {
    infoTextEl.innerText = "Fai tap sullo schermo per ruotare il pezzo, swipe a sinistra o destra per muoverlo, e tieni premuto o fai swipe in basso per farlo cadere!";
} else {
    infoTextEl.innerText = "Usa i tasti freccia della tastiera: Freccia Sinistra/Destra per muovere, Freccia Giù per scendere, Freccia Su o tasto X per ruotare il pezzo!";
}

function openModal(modal) {
    if (!isPaused && !isGameOver) {
        togglePause();
    }
    modal.style.display = 'block';
}

function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
}

document.getElementById('info-btn').addEventListener('click', () => openModal(infoModal));
document.getElementById('leaderboard-btn').addEventListener('click', () => openModal(leaderboardModal));

const arena = createMatrix(12, 17);

const player = {
    pos: {x: 0, y: 0},
    matrix: null,
    score: 0,
    level: 1,
    lines: 0
};

const colors = [
    null,
    '#ff4757', // I
    '#2ed573', // J
    '#1e90ff', // L
    '#ffa502', // O
    '#9b59b6', // S
    '#00d2d3', // T
    '#ff6b81'  // Z
];

function createMatrix(w, h) {
    const matrix = [];
    while (h--) {
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

function createPiece(type) {
    if (type === 'T') {
        return [
            [0, 0, 0],
            [6, 6, 6],
            [0, 6, 0],
        ];
    } else if (type === 'O') {
        return [
            [4, 4],
            [4, 4],
        ];
    } else if (type === 'L') {
        return [
            [0, 3, 0],
            [0, 3, 0],
            [0, 3, 3],
        ];
    } else if (type === 'J') {
        return [
            [0, 2, 0],
            [0, 2, 0],
            [2, 2, 0],
        ];
    } else if (type === 'I') {
        return [
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
            [0, 1, 0, 0],
        ];
    } else if (type === 'S') {
        return [
            [0, 5, 5],
            [5, 5, 0],
            [0, 0, 0],
        ];
    } else if (type === 'Z') {
        return [
            [7, 7, 0],
            [0, 7, 7],
            [0, 0, 0],
        ];
    }
}

function drawMatrix(matrix, offset) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                context.fillStyle = colors[value];
                context.fillRect(x + offset.x, y + offset.y, 1, 1);
                context.strokeStyle = '#111';
                context.lineWidth = 0.05;
                context.strokeRect(x + offset.x, y + offset.y, 1, 1);
            }
        });
    });
}

function draw() {
    context.fillStyle = '#000000';
    context.fillRect(0, 0, canvas.width, canvas.height);

    arena.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                context.fillStyle = colors[value];
                context.fillRect(x, y, 1, 1);
                context.strokeStyle = '#111';
                context.lineWidth = 0.05;
                context.strokeRect(x, y, 1, 1);
            }
        });
    });

    drawMatrix(player.matrix, player.pos);
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                arena[y + player.pos.y][x + player.pos.x] = value;
            }
        });
    });
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [
                matrix[x][y],
                matrix[y][x],
            ] = [
                matrix[y][x],
                matrix[x][y],
            ];
        }
    }
    if (dir > 0) {
        matrix.forEach(row => row.reverse());
    } else {
        matrix.reverse();
    }
}

function playerRotate() {
    const posX = player.pos.x;
    let offset = 1;
    rotate(player.matrix, 1);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -1);
            player.pos.x = posX;
            return;
        }
    }
}

function collide(arena, player) {
    const m = player.matrix;
    const o = player.pos;
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 &&
               (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                return true;
            }
        }
    }
    return false;
}

function arenaSweep() {
    let rowCount = 1;
    outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) {
                continue outer;
            }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 100 * player.level;
        player.lines++;
        rowCount *= 2;

        if (player.lines % 5 === 0) {
            player.level++;
            updateInterval();
            scoreContainer.classList.add('level-flash');
            setTimeout(() => scoreContainer.classList.remove('level-flash'), 600);
        }
    }
    scoreElement.innerText = player.score;
    levelElement.innerText = player.level;
}

function playerDrop() {
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        if (collide(arena, player)) {
            gameOver();
        }
    }
    dropCounter = 0;
}

function move(dir) {
    player.pos.x += dir;
    if (collide(arena, player)) {
        player.pos.x -= dir;
    }
}

function playerReset() {
    const pieces = 'TJLOSZI';
    player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
    player.pos.y = 0;
    player.pos.x = Math.floor((arena[0].length / 2) - (player.matrix[0].length / 2));
    if (collide(arena, player)) {
        gameOver();
    }
}

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;
let isPaused = false;
let isGameOver = false;
let animationId = null;

function updateInterval() {
    dropInterval = Math.max(150, 1000 - (player.level - 1) * 150);
}

function update(time = 0) {
    if (isPaused || isGameOver) return;
    const deltaTime = time - lastTime;
    lastTime = time;
    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
        playerDrop();
    }
    draw();
    animationId = requestAnimationFrame(update);
}

function togglePause() {
    if (isGameOver) return;
    isPaused = !isPaused;
    pauseBtn.innerText = isPaused ? '▶' : '⏸';
    if (!isPaused) {
        lastTime = performance.now();
        animationId = requestAnimationFrame(update);
    }
}

pauseBtn.addEventListener('click', togglePause);

function gameOver() {
    isGameOver = true;
    finalScoreElement.innerText = player.score;
    gameOverScreen.style.display = 'block';
}

function resetGame() {
    arena.forEach(row => row.fill(0));
    player.score = 0;
    player.lines = 0;
    player.level = 1;
    updateInterval();
    scoreElement.innerText = player.score;
    levelElement.innerText = player.level;
    gameOverScreen.style.display = 'none';
    isGameOver = false;
    isPaused = false;
    pauseBtn.innerText = '⏸';
    playerReset();
    lastTime = performance.now();
    cancelAnimationFrame(animationId);
    update();
}

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let longPressTimer = null;
let isLongPressing = false;
let holdDropInterval = null;

canvas.addEventListener('touchstart', (e) => {
    if (isPaused || isGameOver) return;
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = performance.now();
    isLongPressing = false;

    longPressTimer = setTimeout(() => {
        isLongPressing = true;
        holdDropInterval = setInterval(() => {
            playerDrop();
        }, 80);
    }, 350);
}, {passive: true});

canvas.addEventListener('touchmove', (e) => {
    if (isPaused || isGameOver) return;
    const touch = e.touches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
        clearTimeout(longPressTimer);
        if (holdDropInterval) {
            clearInterval(holdDropInterval);
            holdDropInterval = null;
        }
    }
}, {passive: true});

canvas.addEventListener('touchend', (e) => {
    if (isPaused || isGameOver) return;
    clearTimeout(longPressTimer);
    if (holdDropInterval) {
        clearInterval(holdDropInterval);
        holdDropInterval = null;
    }

    if (isLongPressing) return;

    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const dt = performance.now() - touchStartTime;

    if (dt < 300 && Math.abs(dx) < 20 && Math.abs(dy) < 20) {
        playerRotate();
    } else if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) {
            move(1); 
        } else if (dx < -30) {
            move(-1); 
        }
    } else {
        if (dy > 30) {
            playerDrop();
        }
    }
}, {passive: true});

window.addEventListener('keydown', event => {
    if (isPaused || isGameOver) return;
    if (event.key === 'ArrowLeft') {
        move(-1);
    } else if (event.key === 'ArrowRight') {
        move(1);
    } else if (event.key === 'ArrowDown') {
        playerDrop();
    } else if (event.key === 'ArrowUp' || event.code === 'KeyX') {
        playerRotate();
    }
});

playerReset();
updateInterval();
update();
</script>
</body>
</html>
