name: Aggiorna GirettiMap

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 requests

      - name: Run script aggiorna-giri.py
        run: |
          python3 girettimap/aggiorna-giri.py

      - name: Commit file aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add girettimap/giri.js
          # Il parametro || true assorbe l'errore se la cartella ha problemi temporanei
          git add girettimap/img_giri/ || true
          # Verifica in sicurezza che ci siano veri cambiamenti prima di procedere
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico giri.js e anteprime" && git push)