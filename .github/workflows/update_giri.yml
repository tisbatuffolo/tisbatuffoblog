name: Aggiorna Giri Automaticamente

on:
  schedule:
    # Esegue l'azione 2 volte al giorno (alle 08:00 e alle 20:00 UTC)
    - cron: '0 0,12 * * *'
  # Permette di lanciare l'azione manualmente dalla scheda "Actions" di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-giri:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura l'ambiente Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Installa le dipendenze corrette richieste da aggiorna_giri.py
      - name: Install dependencies
        working-directory: girettimap
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver selenium requests pillow

      # 4. Esegue lo script Python dentro la cartella girettimap con il debug attivo
      - name: Run script aggiorna_giri.py
        working-directory: girettimap
        run: |
          python3 aggiorna_giri.py --debug

      # 5. Salva screenshot e HTML in caso di fallimento per capire eventuali blocchi anti-bot
      - name: Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: girettimap/debug_*.png

      # 6. Effettua il commit e il push dei file modificati specificando il branch main
      - name: Commit e push dei file aggiornati
        working-directory: girettimap
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add giri.js img_giri/
          
          git commit -m "Aggiornamento automatico giri.js e anteprime [skip ci]" || echo "Nessuna modifica da committare"
          git push origin HEAD:main