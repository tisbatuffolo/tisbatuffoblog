name: Aggiorna GirettiMap

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    # Questa variabile elimina il warning di Node.js 20 deprecato
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 requests

      - name: Run script aggiorna-giri.py
        run: |
          python3 girettimap/aggiorna-giri.py

      - name: Commit file e immagini
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Aggiunge tutto il contenuto della cartella (giri.js e la sottocartella img_giri)
          git add girettimap/
          
          # Se c'è qualcosa di nuovo fa il commit, altrimenti stampa il messaggio e prosegue senza andare in errore
          git commit -m "Aggiornamento automatico giri.js e anteprime" || echo "Nessuna modifica da committare"
          
          # Invia le modifiche al repository
          git push