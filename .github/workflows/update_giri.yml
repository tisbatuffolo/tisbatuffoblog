name: Aggiorna Giri Automaticamente

on:
  schedule:
    # Esegue l'azione 2 volte al giorno (alle 08:00 e alle 20:00 UTC)
    - cron: '0 0,12 * * *'
  # Permette di lanciare l'azione manualmente dalla scheda "Actions" di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-giri:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura l'ambiente Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Installa le dipendenze corrette richieste da aggiorna_giri.py
      - name: Install dependencies
        working-directory: girettimap
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver selenium requests pillow

      # 4. Esegue lo script Python dentro la cartella girettimap con il debug attivo.
      #    "continue-on-error" ci permette di arrivare comunque allo step 5 e caricare
      #    screenshot/HTML anche quando lo script fallisce, invece di perderli.
      - name: Run script aggiorna_giri.py
        id: run_script
        working-directory: girettimap
        continue-on-error: true
        run: |
          python3 aggiorna_giri.py --debug

      # 5. Salva SEMPRE screenshot e HTML (successo o fallimento) per capire cosa ha
      #    effettivamente visto il browser: pagina bloccata, captcha, contenuto normale, ecc.
      #    NB: prima veniva caricato solo il .png, il .html (il più utile per capire un
      #    blocco anti-bot) non finiva mai negli artifact.
      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            girettimap/debug_*.png
            girettimap/debug_*.html
          if-no-files-found: ignore
          retention-days: 7

      # 6. Se lo script è fallito, interrompiamo qui il job (niente commit/push),
      #    ma solo DOPO aver salvato i file di debug allo step precedente.
      - name: Interrompi il job se lo script è fallito
        if: steps.run_script.outcome == 'failure'
        run: |
          echo "Lo script aggiorna_giri.py è fallito. Controlla l'artifact 'debug-logs' per capire il motivo."
          exit 1

      # 7. Effettua il commit e il push dei file modificati specificando il branch main
      - name: Commit e push dei file aggiornati
        working-directory: girettimap
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add giri.js img_giri/

          git commit -m "Aggiornamento automatico giri.js e anteprime [skip ci]" || echo "Nessuna modifica da committare"
          git push origin HEAD:main