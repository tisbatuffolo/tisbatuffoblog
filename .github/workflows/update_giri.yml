name: Aggiorna Giri Automaticamente

on:
  schedule:
    # Esegue l'azione 2 volte al giorno (alle 08:00 e alle 20:00 UTC)
    - cron: '0 0,12 * * *'
  # Permette di lanciare l'azione manualmente
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-giri:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura l'ambiente Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Installa Xvfb per lo schermo virtuale e le dipendenze Python
      - name: Install dependencies
        working-directory: girettimap
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install undetected-chromedriver selenium requests pillow

      # 4. Esegue lo script in ambiente grafico virtuale (Xvfb)
      - name: Run script aggiorna_giri.py
        working-directory: girettimap
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 aggiorna_giri.py --visible

      # 5. Effettua il commit e il push dei file modificati
      - name: Commit e push dei file aggiornati
        working-directory: girettimap
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add giri.js img_giri/

          git commit -m "Aggiornamento automatico giri.js e anteprime [skip ci]" || echo "Nessuna modifica da committare"
          git push origin HEAD:main