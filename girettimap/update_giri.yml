name: Aggiorna Giri Automaticamente

on:
  schedule:
    # Esegue l'azione 2 volte al giorno (alle 08:00 e alle 20:00 UTC)
    - cron: '0 0,12 * * *'
  # Permette di lanciare l'azione anche manualmente dalla scheda "Actions" di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-giri:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura l'ambiente Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Installa le dipendenze e i browser di Playwright necessari allo script
      - name: Install dependencies
        working-directory: girettimap
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests pillow
          playwright install chromium

      # 4. Esegue lo script Python dentro la cartella girettimap
      - name: Run script aggiorna-giri.py
        working-directory: girettimap
        run: |
          python3 aggiorna-giri.py

      # 5. Effettua il commit e il push dei file modificati (giri.js e img_giri/)
      # in teoria funziona con user github-actions e action github-actions@github.com. In caso sostituire con credenziali bot commentate
      - name: Commit e push dei file aggiornati
        working-directory: girettimap
        run: |
         # git config user.name "github-actions[bot]"
         # git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add giri.js img_giri/
          
          git commit -m "Aggiornamento automatico giri.js e anteprime [skip ci]" || echo "Nessuna modifica da committare"
          git push